<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prep Master Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="admin"><h1>Prep Master Admin Panel</h1><section id="login"><input id="au" placeholder="Username"><input id="ap" type="password" placeholder="Password"><button id="al">LOGIN</button></section><section id="panel" class="hidden"><h2>Apps</h2><div id="appsAdmin"></div><h2>Generate Premium Code</h2><select id="appSelect"></select><button id="gen">GENERATE CODE</button><pre id="newCode"></pre><h2>Codes</h2><div id="codes"></div></section></main><script>
let at='';const $=s=>document.querySelector(s);async function x(u,o={}){o.headers={'Content-Type':'application/json','x-admin-token':at,...(o.headers||{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'error');return d}
$('#al').onclick=async()=>{try{let d=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#au').value,password:$('#ap').value})}).then(r=>r.json());if(!d.token)throw Error(d.error);at=d.token;$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');load()}catch(e){alert(e.message)}};
async function load(){let apps=await x('/api/admin/apps');$('#appsAdmin').innerHTML=apps.map(a=>`<div class="adminrow"><b>${a.name}</b><input value="${a.price}" data-price="${a._id}"><input value="${a.authorizedUrl||''}" placeholder="Authorized URL" data-url="${a._id}"><button onclick="save('${a._id}')">SAVE</button><button onclick="del('${a._id}')">DELETE</button></div>`).join('');$('#appSelect').innerHTML=apps.map(a=>`<option value="${a._id}">${a.name}</option>`).join('');let cs=await x('/api/admin/codes');$('#codes').innerHTML=cs.map(c=>`<div class="adminrow"><b>${c.appId?.name||''}</b> — ${c.status} — ${new Date(c.createdAt).toLocaleString()} ${c.status==='active'?`<button onclick="rev('${c._id}')">REVOKE</button>`:''}</div>`).join('')}
window.save=async id=>{await x('/api/admin/apps/'+id,{method:'PUT',body:JSON.stringify({price:Number(document.querySelector(`[data-price="${id}"]`).value),authorizedUrl:document.querySelector(`[data-url="${id}"]`).value.trim()})});load()};window.del=async id=>{if(confirm('Delete app?')){await x('/api/admin/apps/'+id,{method:'DELETE'});load()}};window.rev=async id=>{await x('/api/admin/codes/'+id+'/revoke',{method:'POST'});load()};$('#gen').onclick=async()=>{try{let d=await x('/api/admin/codes',{method:'POST',body:JSON.stringify({appId:$('#appSelect').value})});$('#newCode').textContent='NEW CODE: '+d.code+'\nCopy it now; it is not stored in plain text.';load()}catch(e){alert(e.message)}};
</script></body></html>
